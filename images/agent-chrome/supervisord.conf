[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:xorg]
command=/usr/bin/Xorg :0 -config /etc/X11/xorg.conf
autorestart=true
priority=100
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":0"
autorestart=true
priority=200
user=chrome
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Chrome on 9223 (not 9222) because cdp-proxy below forwards 9222 → 9223.
; See [program:cdp-proxy] for why the proxy is required.
[program:chrome]
command=/usr/local/bin/chrome
    --no-sandbox
    --disable-gpu
    --disable-dev-shm-usage
    --remote-debugging-port=9223
    --user-data-dir=/data/profile
    --window-size=1920,1080
    --no-first-run
    --no-default-browser-check
    --disable-translate
    --disable-blink-features=AutomationControlled
    --disable-infobars
environment=DISPLAY=":0",HOME="/home/chrome"
autorestart=true
priority=300
user=chrome
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Required, not optional. Chrome 111+ silently forces the DevTools listener
; to loopback regardless of --remote-debugging-address=0.0.0.0 (CVE-2023-2459
; DNS-rebinding mitigation), so chrome binds 127.0.0.1:9223 and this socat
; bridge exposes 0.0.0.0:9222 to other containers on the moat docker network.
; Without it controller's fetch http://<container-ip>:9222/json/version lands
; on a closed port and every register fails with CdpUnreachable.
[program:cdp-proxy]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9223
autorestart=true
priority=350
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
