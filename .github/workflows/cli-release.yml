name: CLI Release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, vctcn, netbird]
    container:
      image: catthehacker/ubuntu:act-24.04
    env:
      # GitHub's job container default HOME is /github/home, but the container
      # runs as root and rustup checks the euid home directory.
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: cli
        run: cargo test

      - name: Build
        working-directory: cli
        run: cargo build --release

      - name: Rename artifact
        run: mv cli/target/release/moat moat-x86_64-linux

      - uses: softprops/action-gh-release@v2
        with:
          files: moat-x86_64-linux
