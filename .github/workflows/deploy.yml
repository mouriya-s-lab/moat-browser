# Tag-triggered build + deploy for moat-browser. Pairs with
# Mouriya-Emma/homelab-tf#133 (RFC #123 phase 3 — moat-browser stack
# via Komodo).
#
# Two jobs:
#   1. build (vctcn netbird runner) — fetch a 5-min Keycloak token,
#      docker login to registry.237575.xyz, build + push three
#      immutable image tags (controller, user-chrome, agent-chrome) at
#      ${VERSION}.
#   2. deploy (vctcn netbird runner) — call Komodo Core's HTTP API at
#      http://moat-app1.mouriya.lan:9120 (mesh-only) to (a) UpdateStack
#      with the published MOAT_BROWSER_VERSION, then (b) DeployStack. Runtime
#      registry login and agent-chrome pulls are owned by the Komodo
#      DockerRegistryAccount + refresh-registry-237575-token Action from
#      Mouriya-Emma/homelab-komodo#49 / Mouriya-Emma/homelab-tf#271.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   KEYCLOAK_REGISTRY_CLIENT_SECRET — `registry` realm `registry`
#       client's client_secret. Same value used by other repos that
#       push to registry.237575.xyz (pve-vctcn/apps/registry).
#   KOMODO_API_KEY / KOMODO_API_SECRET — Komodo Core API credentials.
#       Same key/secret pair the homelab Ansible run uses (see
#       _shared/ansible/secrets.yml in homelab-tf).
#
# Triggered automatically by tag push (`git tag v0.1.5 && git push
# origin v0.1.5`); manual runs use workflow_dispatch and accept an
# optional `version` input — when empty, falls back to UTC timestamp
# `YYYYMMDD-HHMMSS`.

name: Build and deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (default: timestamp YYYYMMDD-HHMMSS UTC)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build + push images
    # vctcn-runner GARM pool (Mouriya-Emma/moat-browser) spawns a LXD instance
    # with security.nesting=true + docker.io + netbird mesh enrollment +
    # /etc/hosts override `registry.237575.xyz → vctcn-registry mesh IP`
    # (pve-vctcn#82 + #84). Push then lands on vctcn-registry over mesh socat
    # :443 → NPM CT 171 → registry/docker_auth, end-to-end < 1 min, well under
    # the 5-min Keycloak token TTL. Previously `ubuntu-latest` + public push
    # hit token expiry on the 9-min agent-chrome upload (moat-browser#196).
    runs-on: [self-hosted, linux, vctcn, netbird]
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # network=host shares the LXD instance's netns + /etc/hosts with
          # buildkit, so the `registry.237575.xyz → 100.85.231.90` override
          # injected by pve-vctcn's runner-registry-mesh-hosts.sh applies to
          # buildkit's push too. Without this, buildkit resolves registry
          # via public DNS → 192.99.9.212 → NAT loopback refused.
          driver-opts: network=host

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Using version: $v"

      - name: Get Keycloak access token
        id: kc
        uses: Mouriya-Emma/keycloak-token-action@v1
        with:
          keycloak-url: https://keycloak.237575.xyz
          realm: registry
          client-id: registry
          client-secret: ${{ secrets.KEYCLOAK_REGISTRY_CLIENT_SECRET }}

      - name: Login to registry.237575.xyz
        run: |
          echo "${{ steps.kc.outputs.access-token }}" | \
            docker login registry.237575.xyz -u sa-registry --password-stdin

      - name: Build + push controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/controller/Dockerfile
          push: true
          tags: registry.237575.xyz/moat-browser/controller:${{ steps.version.outputs.value }}

      - name: Build + push user-chrome
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/user-chrome/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.237575.xyz/moat-browser/user-chrome:${{ steps.version.outputs.value }}

      - name: Build + push agent-chrome
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/agent-chrome/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.237575.xyz/moat-browser/agent-chrome:${{ steps.version.outputs.value }}

      - name: Pull verification
        run: |
          set -euo pipefail
          for image in controller user-chrome agent-chrome; do
            ref="registry.237575.xyz/moat-browser/${image}:${{ steps.version.outputs.value }}"
            docker pull "$ref"
            docker image inspect "$ref" >/dev/null
          done

      - name: Verify candidate Chrome versions before deploy
        run: |
          .github/scripts/verify-chrome-versions.sh \
            "registry.237575.xyz/moat-browser/controller:${{ steps.version.outputs.value }}" \
            "registry.237575.xyz/moat-browser/user-chrome:${{ steps.version.outputs.value }}" \
            "registry.237575.xyz/moat-browser/agent-chrome:${{ steps.version.outputs.value }}"

  deploy:
    name: Deploy to browser VM via Komodo
    # The build job cannot succeed unless the three candidate images pass the gate.
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: [self-hosted, linux, vctcn, netbird]
    env:
      KOMODO_API_URL: http://moat-app1.mouriya.lan:9120
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Update Komodo stack version
        run: |
          set -euo pipefail

          variable_response="$RUNNER_TEMP/moat-browser-version-variable.json"
          get_variable=$(jq -nc '{type:"GetVariable",params:{name:"MOAT_BROWSER_VERSION"}}')
          status=$(curl -sS -o "$variable_response" -w '%{http_code}' \
            -X POST "$KOMODO_API_URL/read" \
            -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" -d "$get_variable")

          case "$status" in
            200)
              variable_write=$(jq -nc --arg value "$VERSION" \
                '{type:"UpdateVariableValue",params:{name:"MOAT_BROWSER_VERSION",value:$value}}')
              ;;
            404|500)
              variable_write=$(jq -nc --arg value "$VERSION" \
                '{type:"CreateVariable",params:{name:"MOAT_BROWSER_VERSION",value:$value,is_secret:false}}')
              ;;
            *)
              cat "$variable_response" >&2
              echo "::error::GetVariable MOAT_BROWSER_VERSION returned HTTP $status" >&2
              exit 1
              ;;
          esac

          curl -fsS -X POST "$KOMODO_API_URL/write" \
            -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" -d "$variable_write" >/dev/null

          stack=$(curl -fsS -X POST "$KOMODO_API_URL/read" \
            -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"GetStack","params":{"stack":"moat-browser"}}')
          current_environment=$(jq -r '.config.environment // ""' <<<"$stack")
          environment=$(
            sed '/^MOAT_BROWSER_VERSION=/d' <<<"$current_environment"
            printf 'MOAT_BROWSER_VERSION=%s\n' "$VERSION"
          )
          BODY=$(jq -nc --arg env "$environment" \
            '{type:"UpdateStack",params:{id:"moat-browser",config:{environment:$env}}}')
          curl -fsS -X POST "$KOMODO_API_URL/write" \
            -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY" >/dev/null
          echo "Variable and Stack updated: MOAT_BROWSER_VERSION=$VERSION."

      - name: Deploy stack
        run: |
          set -euo pipefail
          curl -fsS -X POST "$KOMODO_API_URL/execute" \
            -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"DeployStack","params":{"stack":"moat-browser"}}' \
            -o "$RUNNER_TEMP/deploy_resp.json"

          UPDATE_ID=$(jq -er '._id."$oid" // .id' "$RUNNER_TEMP/deploy_resp.json")
          echo "DeployStack accepted; update id: $UPDATE_ID"

          while true; do
            BODY=$(jq -nc --arg id "$UPDATE_ID" '{type:"GetUpdate",params:{id:$id}}')
            curl -fsS -X POST "$KOMODO_API_URL/read" \
              -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              -o "$RUNNER_TEMP/deploy_update.json"

            STATUS=$(jq -r '.status // "Unknown"' "$RUNNER_TEMP/deploy_update.json")
            SUCCESS=$(jq -r '.success // false' "$RUNNER_TEMP/deploy_update.json")
            echo "DeployStack status: $STATUS success=$SUCCESS"

            if [ "$STATUS" = "Complete" ]; then
              if [ "$SUCCESS" = "true" ]; then
                echo "DeployStack completed successfully."
                jq -r '.logs[]? | "stage=\(.stage) success=\(.success)"' "$RUNNER_TEMP/deploy_update.json"
                break
              fi

              echo "::error::DeployStack completed unsuccessfully."
              jq -r '.logs[]? | "--- stage=\(.stage) success=\(.success) ---\nstdout:\n\(.stdout // "")\nstderr:\n\(.stderr // "")"' "$RUNNER_TEMP/deploy_update.json"
              exit 1
            fi

            case "$STATUS" in
              InProgress|Queued) sleep 5 ;;
              *)
                jq . "$RUNNER_TEMP/deploy_update.json" >&2
                echo "::error::DeployStack reached unexpected state: $STATUS" >&2
                exit 1
                ;;
            esac
          done

          stack=$(curl -fsS -X POST "$KOMODO_API_URL/read" \
            -H "x-api-key: $KOMODO_API_KEY" -H "x-api-secret: $KOMODO_API_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"GetStack","params":{"stack":"moat-browser"}}')
          for service in controller user-chrome agent-chrome-image; do
            deployed_image=$(jq -er --arg service "$service" \
              '.info.deployed_services[] | select(.service_name == $service) | .image' <<<"$stack")
            expected="registry.237575.xyz/moat-browser/${service%-image}:$VERSION"
            test "$deployed_image" = "$expected"
            echo "Verified $service image: $deployed_image"
          done
