# moat-browser stack on `browser` server (VM 104). See homelab-tf#133.
#
# Image tag is driven by ${MOAT_BROWSER_VERSION} from the stack's
# `environment` field, which CI sets via Komodo UpdateStack on each
# tag-triggered deploy. This workload repo owns the compose structure;
# Komodo's registry account remains host infrastructure authority.
#
# Two user-facing long-running services here: controller (Node.js
# WebSocket server + Patchright CDP bridge) and user-chrome (neko-based
# remote Chromium for human SaaS login). agent-chrome containers are
# still spawned on demand by controller via the docker socket, but the
# image itself must be a compose-visible service so Komodo's private
# registry pull path keeps it present on the browser VM. Otherwise a
# post-prune `moat connect` fails before controller can create an agent
# container, because Docker Engine container create does not pull
# missing images.

services:
  user-chrome:
    image: registry.237575.xyz/moat-browser/user-chrome:${MOAT_BROWSER_VERSION}
    container_name: moat-browser-user-chrome
    restart: unless-stopped
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    ports:
      - "8080:8080"
      - "52000-52100:52000-52100/udp"
    volumes:
      - /var/lib/moat-browser/profile:/home/neko/.config/chromium
    environment:
      NEKO_DESKTOP_SCREEN: "1920x1080@30"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${MOAT_BROWSER_ADMIN_PASSWORD}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${MOAT_BROWSER_ADMIN_PASSWORD}"
      NEKO_WEBRTC_EPR: "52000-52100"
      NEKO_WEBRTC_ICELITE: "1"
      NEKO_WEBRTC_NAT1TO1: "192.168.1.221 100.85.9.219"
    networks:
      - moat

  controller:
    image: registry.237575.xyz/moat-browser/controller:${MOAT_BROWSER_VERSION}
    container_name: moat-browser-controller
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/lib/moat-browser/profile:/data/profile:ro
      - /var/lib/moat-browser/profiles:/data/profiles
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: "3000"
      PROFILE_SOURCE: /data/profile
      PROFILES_WORK: /data/profiles
      PROFILES_HOST_PATH: /var/lib/moat-browser/profiles
      DOCKER_NETWORK: moat
      AGENT_CHROME_IMAGE: registry.237575.xyz/moat-browser/agent-chrome:${MOAT_BROWSER_VERSION}
    depends_on:
      - user-chrome
    networks:
      - moat

  # Cache holder for the image controller uses to create per-session
  # agent containers. This container intentionally does not expose CDP
  # or mount a profile; it only keeps the private image in the compose
  # graph so Komodo pulls it with the same DockerRegistryAccount as the
  # long-running services and Docker prune does not remove it as unused.
  agent-chrome-image:
    image: registry.237575.xyz/moat-browser/agent-chrome:${MOAT_BROWSER_VERSION}
    container_name: moat-browser-agent-chrome-image
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-lc"]
    command: ["sleep infinity"]
    networks:
      - moat

networks:
  moat:
    driver: bridge
    name: moat
