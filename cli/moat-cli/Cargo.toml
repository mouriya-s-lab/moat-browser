[package]
name = "moat-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "moat"
path = "src/main.rs"

[dependencies]
moat-sdk = { path = "../sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
