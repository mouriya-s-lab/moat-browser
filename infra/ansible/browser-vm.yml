---
- hosts: all
  become: yes
  tasks:
    - name: Install prerequisites
      apt:
        name:
          - curl
          - git
          - jq
          - ca-certificates
          - gnupg
        state: present

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable"

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Install Bun
      shell: curl -fsSL https://bun.sh/install | bash
      args:
        creates: /root/.bun/bin/bun

    - name: Add Bun to PATH
      lineinfile:
        path: /root/.bashrc
        line: 'export PATH="$HOME/.bun/bin:$PATH"'

    - name: Install qemu-guest-agent
      apt:
        name: qemu-guest-agent
        state: present

    - name: Enable qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started

    - name: Create profile directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - /data/profiles/frozen
        - /data/profiles/live
        - /data/profiles/archive
